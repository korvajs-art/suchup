<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 변경 | 수첩</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="assets/korva-logo.gif" type="image/gif" />
</head>
<body class="settings-page">
  <div class="app">
    <header class="header">
      <a class="brand brand--link" href="index.html" id="backLink">
        <img class="brand__logo" src="assets/korva-logo.gif" alt="대한민국재향군인회" width="40" height="40" />
        <div class="brand__text">
          <span class="brand__name">수첩</span>
          <span class="brand__sub" id="accountLabel">비밀번호 변경</span>
        </div>
      </a>
      <a class="ghost-btn header-action" href="index.html" id="cancelLink">닫기</a>
    </header>

    <main class="main settings-main">
      <section class="settings-card" aria-labelledby="pwTitle">
        <div class="settings-card__hero">
          <span class="settings-card__icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </span>
          <div>
            <h1 id="pwTitle">비밀번호 변경</h1>
            <p>현재 비밀번호 확인 후 새 비밀번호로 바꿉니다.</p>
          </div>
        </div>

        <form id="passwordForm" novalidate>
          <label class="field">
            <span>현재 비밀번호</span>
            <div class="pw-input">
              <input type="password" id="pwCurrent" required autocomplete="current-password" placeholder="현재 비밀번호 입력" />
              <button type="button" class="pw-toggle" data-toggle="pwCurrent" aria-label="비밀번호 표시">보기</button>
            </div>
          </label>

          <label class="field">
            <span>새 비밀번호</span>
            <div class="pw-input">
              <input type="password" id="pwNew" required autocomplete="new-password" minlength="4" placeholder="4자 이상 입력" />
              <button type="button" class="pw-toggle" data-toggle="pwNew" aria-label="비밀번호 표시">보기</button>
            </div>
            <p class="field-hint" id="pwLengthHint">4자 이상 입력해 주세요.</p>
          </label>

          <label class="field">
            <span>새 비밀번호 확인</span>
            <div class="pw-input">
              <input type="password" id="pwNew2" required autocomplete="new-password" minlength="4" placeholder="새 비밀번호 다시 입력" />
              <button type="button" class="pw-toggle" data-toggle="pwNew2" aria-label="비밀번호 표시">보기</button>
            </div>
            <p class="field-hint" id="pwMatchHint" hidden></p>
          </label>

          <p class="form-error" id="pwError" hidden></p>
          <p class="form-success" id="pwSuccess" hidden>비밀번호가 변경되었습니다.</p>

          <div class="settings-actions">
            <a class="ghost-btn settings-actions__cancel" href="index.html" id="cancelLink">취소</a>
            <button type="submit" class="primary-btn" id="pwSaveBtn">변경하기</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

  <script src="js/auth.js" charset="utf-8"></script>
  <script src="js/password.js" charset="utf-8"></script>
</body>
</html>
