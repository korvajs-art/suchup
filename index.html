<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a4a7a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="수첩" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="대한민국재향군인회 연락처 수첩" />
  <title>수첩</title>
  <!-- 첫 그림을 그리기 전에 테마를 정해야 화면이 번쩍이지 않는다. -->
  <script>
    (() => {
      const saved = localStorage.getItem("suchup.theme") || "system";
      const dark = saved === "dark" || (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
</head>
<body class="notebook-page">
  <div class="app">
    <header class="header">
      <div class="brand">
        <img class="brand__logo" src="assets/korva-logo.gif" alt="대한민국재향군인회" width="40" height="40" />
        <div class="brand__text">
          <span class="brand__name">수첩</span>
          <span class="brand__sub">대한민국재향군인회</span>
        </div>
      </div>
      <div class="header__actions">
        <button type="button" class="icon-btn" id="themeBtn" aria-label="화면 모드 전환">
          <svg class="icon-btn__moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
          <svg class="icon-btn__sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        </button>
        <button type="button" class="menu-btn" id="menuBtn" aria-label="메뉴 열기" aria-expanded="false" aria-controls="drawer">
          <span class="menu-btn__bar"></span>
          <span class="menu-btn__bar"></span>
          <span class="menu-btn__bar"></span>
        </button>
      </div>
    </header>

    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer__account">
        <p class="drawer__account-name" id="drawerUserName">—</p>
        <p class="drawer__account-role" id="drawerUserRole">사용자</p>
      </div>
      <p class="drawer__title">메뉴</p>
      <nav class="drawer__nav">
        <a href="index.html" class="drawer__link is-active">연락처</a>
        <a href="admin.html" class="drawer__link" id="adminLink" hidden>관리자</a>
      </nav>
      <p class="drawer__title">화면</p>
      <div class="theme-switch" id="themeSwitch" role="group" aria-label="화면 모드">
        <button type="button" class="theme-switch__opt" data-theme-set="light" aria-pressed="false">밝게</button>
        <button type="button" class="theme-switch__opt" data-theme-set="dark" aria-pressed="false">어둡게</button>
        <button type="button" class="theme-switch__opt" data-theme-set="system" aria-pressed="false">시스템</button>
      </div>
      <p class="drawer__title">계정</p>
      <nav class="drawer__nav">
        <a href="password.html" class="drawer__link">비밀번호 변경</a>
        <button type="button" class="drawer__link drawer__link--btn drawer__link--danger" id="logoutBtn">로그아웃</button>
      </nav>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div class="search-bar">
          <span class="search-bar__icon" aria-hidden="true">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-3.5-3.5" />
            </svg>
          </span>
          <label class="visually-hidden" for="searchInput">이름·소속·연락처 검색</label>
          <input
            type="search"
            id="searchInput"
            class="search-bar__input"
            placeholder="이름 또는 전화번호 검색"
            autocomplete="off"
            enterkeyhint="search"
          />
          <button type="button" class="search-bar__clear" id="searchClear" aria-label="검색어 지우기" hidden>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>
        <button type="button" class="filter-btn" id="filterBtn" aria-label="검색 조건" aria-haspopup="dialog">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 6h16M7 12h10M10 18h4" />
          </svg>
          <span>조건</span>
          <span class="filter-btn__badge" id="filterBadge" hidden>0</span>
        </button>
      </div>

      <div class="workspace">
        <nav class="region-rail" id="regionChips" role="tablist" aria-label="소속 선택"></nav>

        <div class="list-scroll">
          <div class="skeleton" id="loadingState" aria-hidden="true" hidden>
            <div class="skeleton__row"><span class="skeleton__avatar"></span><span class="skeleton__lines"><span class="skeleton__line"></span><span class="skeleton__line skeleton__line--short"></span></span></div>
            <div class="skeleton__row"><span class="skeleton__avatar"></span><span class="skeleton__lines"><span class="skeleton__line"></span><span class="skeleton__line skeleton__line--short"></span></span></div>
            <div class="skeleton__row"><span class="skeleton__avatar"></span><span class="skeleton__lines"><span class="skeleton__line"></span><span class="skeleton__line skeleton__line--short"></span></span></div>
            <div class="skeleton__row"><span class="skeleton__avatar"></span><span class="skeleton__lines"><span class="skeleton__line"></span><span class="skeleton__line skeleton__line--short"></span></span></div>
            <div class="skeleton__row"><span class="skeleton__avatar"></span><span class="skeleton__lines"><span class="skeleton__line"></span><span class="skeleton__line skeleton__line--short"></span></span></div>
          </div>
          <div class="status-msg status-msg--error" id="errorState" hidden>
            <p>연락처를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>
            <button type="button" class="retry-btn" id="retryBtn">다시 시도</button>
          </div>
          <p class="list-meta" id="resultCount" aria-live="polite" hidden></p>
          <div class="groups" id="contactList" hidden></div>
          <p class="empty-state" id="emptyState" hidden>검색 결과가 없습니다.</p>
        </div>
      </div>
    </main>
  </div>

  <div class="sheet" id="filterSheet" role="dialog" aria-modal="true" aria-labelledby="filterSheetTitle" hidden>
    <div class="sheet__backdrop" data-sheet-close></div>
    <div class="sheet__panel">
      <div class="sheet__grabber" aria-hidden="true"></div>
      <h2 class="sheet__title" id="filterSheetTitle">상세 검색</h2>

      <div class="sheet__group">
        <label class="sheet__label" for="deptFilter">시군구 · 부서</label>
        <select id="deptFilter" class="sheet__select">
          <option value="">전체</option>
        </select>
      </div>

      <div class="sheet__group">
        <span class="sheet__label">직위</span>
        <div class="sheet__chips" id="positionChips"></div>
      </div>

      <div class="sheet__group">
        <label class="sheet__toggle">
          <span class="sheet__toggle-text">
            공석 숨기기
            <span class="sheet__toggle-hint">비어 있는 자리를 목록에서 감춥니다.</span>
          </span>
          <input type="checkbox" id="hideVacant" />
        </label>
      </div>

      <div class="sheet__actions">
        <button type="button" class="ghost-btn" id="filterReset">초기화</button>
        <button type="button" class="primary-btn" id="filterApply">닫기</button>
      </div>
    </div>
  </div>

  <div class="install-banner" id="installBanner" hidden role="dialog" aria-labelledby="installTitle">
    <p class="install-banner__title" id="installTitle" data-install-title>수첩 앱으로 설치</p>
    <p class="install-banner__lead" data-install-lead>홈 화면에 아이콘을 두면 일반 앱처럼 바로 열 수 있습니다.</p>
    <div class="install-banner__actions">
      <button type="button" class="ghost-btn" data-install-dismiss>나중에</button>
      <button type="button" class="primary-btn" data-install-action>설치하기</button>
    </div>
  </div>

  <script src="js/auth.js" charset="utf-8"></script>
  <script src="js/theme.js" charset="utf-8"></script>
  <script src="js/org-data.js" charset="utf-8"></script>
  <script src="js/org.js" charset="utf-8"></script>
  <script src="js/sort.js" charset="utf-8"></script>
  <script src="js/app.js" charset="utf-8"></script>
  <script src="js/pwa.js" charset="utf-8"></script>
</body>
</html>
