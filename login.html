<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a4a7a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="수첩" />
  <title>수첩 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
</head>
<body class="auth-body">
  <div class="auth-scene" aria-hidden="true">
    <span class="auth-scene__mesh"></span>
    <span class="auth-scene__orb auth-scene__orb--a"></span>
    <span class="auth-scene__orb auth-scene__orb--b"></span>
    <span class="auth-scene__orb auth-scene__orb--c"></span>
    <span class="auth-scene__grid"></span>
  </div>

  <main class="auth-layout">
    <section class="auth-brand">
      <img class="auth-brand__logo" src="assets/korva-logo.gif" alt="대한민국재향군인회" width="280" height="76" />
      <p class="auth-brand__eyebrow">대한민국재향군인회</p>
      <h1 class="auth-brand__title">수첩</h1>
      <p class="auth-brand__lead">연락처를 빠르고 정확하게 찾아보세요.</p>
    </section>

    <section class="auth-panel">
      <header class="auth-panel__head">
        <h2>로그인</h2>
        <p>계정으로 수첩에 입장합니다.</p>
      </header>

      <form class="auth-form" id="loginForm" novalidate>
        <label class="auth-field">
          <span class="auth-field__label">아이디</span>
          <span class="auth-field__box">
            <svg class="auth-field__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <input type="text" name="username" id="username" autocomplete="username" required autofocus placeholder="아이디 입력" />
          </span>
        </label>

        <label class="auth-field">
          <span class="auth-field__label">비밀번호</span>
          <span class="auth-field__box">
            <svg class="auth-field__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input type="password" name="password" id="password" autocomplete="current-password" required placeholder="비밀번호 입력" />
            <button type="button" class="auth-field__toggle" id="pwToggle" aria-label="비밀번호 표시">보기</button>
          </span>
        </label>

        <p class="form-error auth-form__error" id="loginError" hidden></p>

        <button type="submit" class="auth-submit" id="loginBtn">
          <span class="auth-submit__label">로그인</span>
        </button>
      </form>

      <div class="auth-roles" aria-label="계정 안내">
        <button type="button" class="auth-role" data-fill="suchup">
          <span class="auth-role__tag">일반</span>
          <span class="auth-role__id">suchup</span>
        </button>
        <button type="button" class="auth-role" data-fill="admin">
          <span class="auth-role__tag">관리</span>
          <span class="auth-role__id">admin</span>
        </button>
      </div>
    </section>
  </main>

  <script src="js/auth.js" charset="utf-8"></script>
  <script src="js/login.js" charset="utf-8"></script>
  <script src="js/pwa.js" charset="utf-8"></script>
</body>
</html>
